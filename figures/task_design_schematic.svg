<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Task-Switching Block Structure</text>

  <!-- Legend -->
  <rect x="560" y="14" width="16" height="16" fill="#60a5fa" stroke="#1d4ed8"/>
  <text x="582" y="27" font-size="12.5" fill="#374151">Task A</text>
  <rect x="640" y="14" width="16" height="16" fill="#fb923c" stroke="#c2410c"/>
  <text x="662" y="27" font-size="12.5" fill="#374151">Task B</text>

  <!-- Single block -->
  <text x="60" y="90" font-size="14.5" font-weight="700" fill="#1d4ed8">Single block</text>
  <text x="60" y="108" font-size="11.5" fill="#4b5563">one task throughout &#8594; every trial is condition "single"</text>

  <g id="single-trials">
    <!-- 6 trials all task A -->
    <rect x="60" y="120" width="70" height="50" fill="#60a5fa" stroke="#1d4ed8" rx="4"/>
    <rect x="140" y="120" width="70" height="50" fill="#60a5fa" stroke="#1d4ed8" rx="4"/>
    <rect x="220" y="120" width="70" height="50" fill="#60a5fa" stroke="#1d4ed8" rx="4"/>
    <rect x="300" y="120" width="70" height="50" fill="#60a5fa" stroke="#1d4ed8" rx="4"/>
    <rect x="380" y="120" width="70" height="50" fill="#60a5fa" stroke="#1d4ed8" rx="4"/>
    <rect x="460" y="120" width="70" height="50" fill="#60a5fa" stroke="#1d4ed8" rx="4"/>
    <text x="95" y="150" text-anchor="middle" font-size="12" fill="#1e3a8a">A</text>
    <text x="175" y="150" text-anchor="middle" font-size="12" fill="#1e3a8a">A</text>
    <text x="255" y="150" text-anchor="middle" font-size="12" fill="#1e3a8a">A</text>
    <text x="335" y="150" text-anchor="middle" font-size="12" fill="#1e3a8a">A</text>
    <text x="415" y="150" text-anchor="middle" font-size="12" fill="#1e3a8a">A</text>
    <text x="495" y="150" text-anchor="middle" font-size="12" fill="#1e3a8a">A</text>
  </g>
  <g font-size="10.5" fill="#4b5563" text-anchor="middle">
    <text x="95" y="188">single</text>
    <text x="175" y="188">single</text>
    <text x="255" y="188">single</text>
    <text x="335" y="188">single</text>
    <text x="415" y="188">single</text>
    <text x="495" y="188">single</text>
  </g>

  <!-- Mixed block -->
  <text x="60" y="240" font-size="14.5" font-weight="700" fill="#c2410c">Mixed block</text>
  <text x="60" y="258" font-size="11.5" fill="#4b5563">two tasks interleaved &#8594; trial is "repeat" (same as previous) or "switch" (different)</text>

  <g id="mixed-trials">
    <rect x="60" y="270" width="70" height="50" fill="#60a5fa" stroke="#1d4ed8" rx="4"/>
    <rect x="140" y="270" width="70" height="50" fill="#60a5fa" stroke="#1d4ed8" rx="4"/>
    <rect x="220" y="270" width="70" height="50" fill="#fb923c" stroke="#c2410c" rx="4"/>
    <rect x="300" y="270" width="70" height="50" fill="#fb923c" stroke="#c2410c" rx="4"/>
    <rect x="380" y="270" width="70" height="50" fill="#60a5fa" stroke="#1d4ed8" rx="4"/>
    <rect x="460" y="270" width="70" height="50" fill="#fb923c" stroke="#c2410c" rx="4"/>
    <text x="95" y="300" text-anchor="middle" font-size="12" fill="#1e3a8a">A</text>
    <text x="175" y="300" text-anchor="middle" font-size="12" fill="#1e3a8a">A</text>
    <text x="255" y="300" text-anchor="middle" font-size="12" fill="#7c2d12">B</text>
    <text x="335" y="300" text-anchor="middle" font-size="12" fill="#7c2d12">B</text>
    <text x="415" y="300" text-anchor="middle" font-size="12" fill="#1e3a8a">A</text>
    <text x="495" y="300" text-anchor="middle" font-size="12" fill="#7c2d12">B</text>
  </g>
  <g font-size="10.5" fill="#4b5563" text-anchor="middle">
    <text x="95" y="338">(start)*</text>
    <text x="175" y="338" font-weight="700">repeat</text>
    <text x="255" y="338" font-weight="700">switch</text>
    <text x="335" y="338" font-weight="700">repeat</text>
    <text x="415" y="338" font-weight="700">switch</text>
    <text x="495" y="338" font-weight="700">switch</text>
  </g>

  <!-- annotation arrows for repeat/switch example -->
  <path d="M175,362 C175,380 255,380 255,362" fill="none" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="215" y="396" text-anchor="middle" font-size="10.5" fill="#6b7280">task changes A&#8594;B</text>

  <text x="60" y="440" font-size="11" fill="#6b7280">* Each block begins with a sentinel trial (switches == "9") marking a new block;</text>
  <text x="60" y="456" font-size="11" fill="#6b7280">  this marker trial is excluded from condition coding (condition = NA), and is</text>
  <text x="60" y="472" font-size="11" fill="#6b7280">  simplified/omitted here for readability.</text>

  <text x="60" y="500" font-size="11.5" fill="#374151">Switch cost = performance(switch) &#8722; performance(repeat), scored via LISAS to combine RT and accuracy.</text>
</svg>
