<svg viewBox="0 0 640 1120" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="1120" fill="#ffffff"/>

  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">FLEX Data Pipeline</text>

  <!-- Stage 1 -->
  <rect x="70" y="70" width="500" height="110" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="320" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">1. Discover &amp; validate files</text>
  <text x="320" y="126" text-anchor="middle" font-size="12.5" fill="#3730a3">Parse FLEX######_sw|si-&lt;task&gt;_*.json</text>
  <text x="320" y="146" text-anchor="middle" font-size="12.5" fill="#3730a3">Extract subject_id, type (switch/single), task</text>
  <text x="320" y="166" text-anchor="middle" font-size="12.5" fill="#3730a3">Keep only files matching the 27-task session order</text>

  <line x1="320" y1="180" x2="320" y2="220" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="70" y="222" width="500" height="110" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="320" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#164e63">2. Select final attempt</text>
  <text x="320" y="278" text-anchor="middle" font-size="12.5" fill="#155e75">Group by subject_id x task</text>
  <text x="320" y="298" text-anchor="middle" font-size="12.5" fill="#155e75">Keep JSON flagged type == "last-block"</text>
  <text x="320" y="318" text-anchor="middle" font-size="12.5" fill="#155e75">Drop subject x task if no last-block file exists</text>

  <line x1="320" y1="332" x2="320" y2="372" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="70" y="374" width="500" height="150" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="320" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">3. Reconstruct blocks &amp; conditions</text>
  <text x="320" y="430" text-anchor="middle" font-size="12.5" fill="#854d0e">compute_blocks(): switches == "9" marks a new block</text>
  <text x="320" y="450" text-anchor="middle" font-size="12.5" fill="#854d0e">Classify block_type: single (1 task) vs. mixed (2 tasks)</text>
  <text x="320" y="470" text-anchor="middle" font-size="12.5" fill="#854d0e">Classify condition: single / repeat / switch</text>
  <text x="320" y="490" text-anchor="middle" font-size="12.5" fill="#854d0e">Block-start marker trials (9) coded as NA</text>
  <text x="320" y="510" text-anchor="middle" font-size="12.5" fill="#854d0e">Compute error = 1 - answer_correct</text>

  <line x1="320" y1="524" x2="320" y2="564" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="70" y="566" width="500" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="596" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">4. Score conditions (LISAS)</text>
  <text x="320" y="622" text-anchor="middle" font-size="12.5" fill="#166534">Per condition: mean correct RT (RTj), mean error (PEj)</text>
  <text x="320" y="642" text-anchor="middle" font-size="12.5" fill="#166534">Global SD of RT (SRT) and error (SPE) across all trials</text>
  <text x="320" y="662" text-anchor="middle" font-size="12.5" fill="#166534" font-family="monospace">LISAS = RTj + (SRT / SPE) x PEj</text>
  <text x="320" y="684" text-anchor="middle" font-size="12.5" fill="#166534">Print console summary; merge LISAS back onto every trial row</text>
  <text x="320" y="704" text-anchor="middle" font-size="12.5" fill="#166534">matching its own condition</text>
  <text x="320" y="724" text-anchor="middle" font-size="12.5" fill="#166534">by condition</text>

  <line x1="320" y1="736" x2="320" y2="776" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="70" y="778" width="500" height="160" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="320" y="808" text-anchor="middle" font-size="15" font-weight="700" fill="#831843">Output: BIDS-style TSV</text>
  <text x="320" y="836" text-anchor="middle" font-size="12" font-family="monospace" fill="#9d174d">output/sub-XXXXXX/ses-training/beh/</text>
  <text x="320" y="856" text-anchor="middle" font-size="12" font-family="monospace" fill="#9d174d">sub-XXXXXX_ses-training_task-&lt;task&gt;_beh.tsv</text>
  <text x="320" y="884" text-anchor="middle" font-size="12" fill="#9d174d">columns: participant_id, group, switches, tasks,</text>
  <text x="320" y="902" text-anchor="middle" font-size="12" fill="#9d174d">reaction_time, answer_correct, block, block_type,</text>
  <text x="320" y="920" text-anchor="middle" font-size="12" fill="#9d174d">condition, error, lisas</text>

  <text x="320" y="1000" text-anchor="middle" font-size="11.5" fill="#6b7280">One TSV per subject per task, ready for group-level analysis.</text>
</svg>
